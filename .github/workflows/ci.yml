name: Causal verification runner conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      CI_OUTPUT_ROOT: ${{ runner.temp }}/gooo-causal-verification-runner-${{ github.run_id }}
    steps:
      - name: Check out the subject
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          cache: false

      - name: Bind the CI toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(go env GOVERSION)" = "go1.27.0"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"

      - name: Verify formatting without writing the checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Measure the CI build
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$CI_OUTPUT_ROOT"
          scripts/measure-command.sh "$CI_OUTPUT_ROOT/build-observation.json" "$CI_OUTPUT_ROOT/gooo-causal-verification-runner" "$CI_OUTPUT_ROOT/build.log" "build-${GITHUB_RUN_ID}" \
            go build -trimpath -o "$CI_OUTPUT_ROOT/gooo-causal-verification-runner" ./cmd/gooo-causal-verification-runner

      - name: Vet in CI
        run: go vet ./...

      - name: Measure the CI test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts/measure-command.sh "$CI_OUTPUT_ROOT/test-observation.json" "$CI_OUTPUT_ROOT/test-result" "$CI_OUTPUT_ROOT/test.log" "test-${GITHUB_RUN_ID}" \
            go test -json ./...

      - name: Run fixture conformance and full-oracle comparisons
        shell: bash
        run: |
          set -Eeuo pipefail
          build_ms=$(jq -r '.wall_ms' "$CI_OUTPUT_ROOT/build-observation.json")
          test_ms=$(jq -r '.wall_ms' "$CI_OUTPUT_ROOT/test-observation.json")
          scripts/ci-conformance.sh "$GITHUB_WORKSPACE" "$CI_OUTPUT_ROOT/gooo-causal-verification-runner" "$CI_OUTPUT_ROOT/cases" "$build_ms" "$test_ms"
          cat "$CI_OUTPUT_ROOT/cases/ci-summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload machine receipts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-causal-verification-runner-${{ github.run_id }}
          path: ${{ env.CI_OUTPUT_ROOT }}
          if-no-files-found: error

